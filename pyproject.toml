[project]
name = "paper-screening"
version = "0.1.0"
description = "Organizer-side screening for conference submissions (LaTeX and Word)"
requires-python = ">=3.12"
dependencies = ["pypandoc_binary>=1.15", "pypdf>=5", "paper-preflight==1.0.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1", "httpx>=0.27"]
web = ["fastapi>=0.110", "jinja2>=3.1", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[tool.setuptools]
packages = ["screening"]

[tool.setuptools.package-data]
screening = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
