<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Screening{% endblock %}</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/" aria-label="Review queue">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2.5" width="14" height="19" rx="3" fill="var(--accent)" opacity=".25"/><rect x="7" y="2.5" width="14" height="19" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.8"/><path d="M10.5 12.5l2.2 2.2 4.3-4.6" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Screening
  </a>
  {% block crumb %}{% endblock %}
  <div class="right">
    {% block actions %}{% endblock %}
    <span class="who">Acting as {{ actor }}</span>
    <button class="btn ghost theme" type="button" aria-label="Switch light or dark theme" onclick="toggleTheme()">
      <svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
    </button>
  </div>
</header>
{% block body %}{% endblock %}
<script>
  function toggleTheme() {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  function typing(e) { return /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName); }
</script>
{% block script %}{% endblock %}
</body>
</html>
